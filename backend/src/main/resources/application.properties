spring.application.name=events-api
server.port=${SERVER_PORT:8080}

# Datasource PostgreSQL 17 (credenciais via variável de ambiente; nada de segredo em código)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/eventsdb}
spring.datasource.username=${DATABASE_USERNAME:events_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA: validate apenas (schema gerenciado pelo Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway ativo
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson/Boot 4: defaults ISO para java.time (propriedades Jackson 2 removidas por incompatibilidade com Jackson 3)

# Limite de corpo: 1 MB (RN-16) — multipart não cobre corpo JSON; server.tomcat
# é a defesa do container e o RequestSizeFilter devolve ProblemDetail (E-09).
server.tomcat.max-http-request-body-size=1MB

# Rate limiter em POST /v1/events: 100 req/min por usuário autenticado (RN-15, PA-01).
app.ratelimit.enabled=true
app.ratelimit.requests-per-minute=100

# Timeouts explícitos de chamadas externas (connect + read).
app.client.connect-timeout=5s
app.client.read-timeout=10s

# Virtual threads para I/O (Spring Boot 4 / Java 25)
spring.threads.virtual.enabled=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator mínimo
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
