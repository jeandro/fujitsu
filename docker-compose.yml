services:
  postgres:
    image: postgres:17
    container_name: fujitsu-postgres
    environment:
      POSTGRES_DB: eventsdb
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d eventsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
